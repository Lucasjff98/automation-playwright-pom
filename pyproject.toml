[project]
name = "automation-playwright-pom"
version = "0.2.0"
description = "Resilient web automation and data-extraction API built with Playwright, FastAPI and the Page Object Model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "structlog>=23.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-playwright>=0.4.0",
    "httpx>=0.27.0",
]
